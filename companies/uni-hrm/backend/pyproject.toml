[project]
name = "uni-hrm"
version = "0.1.0"
description = "University HRM system for Uzbekistan"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-filter>=24.0",
    "django-simple-history>=3.7",
    "django-mptt>=0.16",
    "django-unfold>=0.40",
    "djangorestframework-simplejwt>=5.3",
    "celery[redis]>=5.4",
    "django-redis>=5.4",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "django-allauth[socialaccount]>=65.0",
    "openpyxl>=3.1.5",
    "channels==4.2.0",
    "daphne==4.1.0",
    "channels-redis>=4.2.1",
    "weasyprint==62.3",
    "jinja2==3.1.4",
    "drf-spectacular>=0.29.0",
    "google-auth>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"config/settings/development.py" = ["F405"]
"config/settings/production.py" = ["F405"]
"*/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
